<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAPTOR FIR — Matching v0.6</title>
<link rel="stylesheet" href="./matching.css" />
</head>
<body>
<section class="matching-page">
  <main class="matching-app"><section class="matching-left">
    <header class="matching-toolbar"><div class="matching-tt">GRAPH DISPLAY</div><div class="matching-sep"></div><div class="matching-checks">
      <label class="matching-check"><input id="tp" type="checkbox" checked>Show phase</label>
      <label class="matching-check"><input id="tm" type="checkbox" checked>Show magnitude</label>
      <label class="matching-check"><input id="tw" type="checkbox" checked>Phase wrap lines</label>
      <label class="matching-check"><input id="ts" type="checkbox" checked>Sync cursor</label>
    </div>
    <div class="matching-actions"><span class="matching-hint">Wheel: zoom · Shift+drag: pan · Alt+drag: band · Double-click: fit</span><button class="matching-btn" id="cb">CLEAR BAND</button><button class="matching-btn" id="fit">FIT 20–20k</button></div></header>
    <section class="matching-graphs">
      <article class="matching-card"><header class="matching-head"><div class="matching-title"><span class="matching-dot"></span>Phase</div><div class="matching-readout" id="pr">— Hz · —°</div><span class="matching-unit">deg</span></header><div class="matching-plot" id="pw"><canvas id="phase"></canvas><div class="matching-badge" id="pb"></div><div class="matching-pill" id="pp"></div></div></article>
      <article class="matching-card"><header class="matching-head"><div class="matching-title"><span class="matching-dot"></span>Magnitude</div><div class="matching-readout" id="mr">— Hz · — dB</div><span class="matching-unit">dB</span></header><div class="matching-plot" id="mw"><canvas id="mag"></canvas><div class="matching-badge" id="mb"></div><div class="matching-pill" id="mp"></div></div></article>
    </section>
  </section><aside class="matching-tools"><header class="matching-tools-head">MATCHING TOOLS</header><div class="matching-tools-body"></div></aside></main>
</section>
<script src="./matching-dom.js"></script>
<script src="./matching.js"></script>
</body></html>
